# Development dependencies: Postgres only. Run the server and agent
# directly with `go run` for a fast iteration loop:
#
#   make dev-up
#   LOCALMESH_DEV_INSECURE_HTTP=1 \
#   LOCALMESH_DATABASE_URL='postgres://localmesh:localmesh@localhost:5433/localmesh?sslmode=disable' \
#   go run ./cmd/localmesh-server

name: localmesh-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: localmesh
      POSTGRES_USER: localmesh
      POSTGRES_PASSWORD: localmesh
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localmesh -d localmesh"]
      interval: 3s
      timeout: 2s
      retries: 10
    volumes:
      - localmesh-dev-pg:/var/lib/postgresql/data

volumes:
  localmesh-dev-pg:
