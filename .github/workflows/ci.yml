name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - name: go test (unit + e2e; e2e spins a postgres container)
        run: go test ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: agent builds for all target platforms
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/localmesh-agent
          GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/localmesh-agent
          GOOS=linux  GOARCH=amd64 go build -o /dev/null ./cmd/localmesh-agent
          GOOS=linux  GOARCH=arm64 go build -o /dev/null ./cmd/localmesh-agent
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/localmesh-agent

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
