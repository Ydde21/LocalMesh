name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - name: go test (unit + e2e; e2e spins a postgres container)
        run: go test ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: agent builds for all target platforms
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/localmesh-agent
          GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/localmesh-agent
          GOOS=linux  GOARCH=amd64 go build -o /dev/null ./cmd/localmesh-agent
          GOOS=linux  GOARCH=arm64 go build -o /dev/null ./cmd/localmesh-agent
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/localmesh-agent

  # Runs the real agent binary headless on each OS and vets/tests the
  # agent packages natively. This is a smoke gate, not fleet validation:
  # runners have no GPUs and no heterogeneous hardware — NVIDIA code is
  # covered by parser/exec-seam unit tests instead. See docs/ci.md.
  agent-smoke:
    name: agent-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./internal/agent/...
      - name: go test
        run: go test -count=1 ./internal/agent/...
      - name: go test -race
        # -race needs cgo: gcc on linux/windows, clang on macOS — all
        # present on the hosted images today. Guarded on Windows so an
        # image change drops to a loud SKIP line instead of a red job.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && ! command -v gcc >/dev/null 2>&1; then
            echo "SKIP: race detector requires cgo+gcc; no gcc on this windows image"
            exit 0
          fi
          go test -race -count=1 ./internal/agent/...
      - name: build + headless + runtime smoke (service lifecycle, doctor contract, config round-trip)
        # bash resolves to Git Bash on windows runners.
        shell: bash
        run: bash scripts/ci-agent-smoke.sh

  # Real end-to-end on shipped binaries: postgres service + server +
  # fakeollama + agent — enroll → admin approve → WS connect →
  # capability report → /v1/chat/completions through the gateway.
  # The single highest-fidelity job in the workflow: it exercises the
  # wire protocol, migrations, and the admin API, not just compile+CLI.
  agent-integration:
    name: agent-integration (linux)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: localmeshtest
          POSTGRES_DB: localmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d localmesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      LOCALMESH_DATABASE_URL: postgres://postgres:localmeshtest@127.0.0.1:5432/localmesh?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: e2e smoke — enroll→approve→connect→infer on real binaries
        run: bash scripts/ci-e2e-smoke.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
